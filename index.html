  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V)},k,u(D)));
  try{localStorage.setItem("mbk",pw)}catch(e){}
  document.open();document.write(t);document.close();
}
async function tryPw(pw,quiet){try{await unlock(pw);return true}catch(e){if(!quiet)document.getElementById("m").textContent="비밀번호가 맞지 않습니다";return false}}
